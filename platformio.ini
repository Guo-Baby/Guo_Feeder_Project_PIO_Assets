; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

#挂载文件系统为littlefs
board_build.filesystem = littlefs
# N16R8 QIO Flash + OPI PSRAM 核心配置
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

# 全套PSRAM底层宏，缺一不可
board_build.extra_flags =
  -DBOARD_HAS_PSRAM
  -DCONFIG_SPIRAM
  -DCONFIG_SPIRAM_SUPPORT=1
  -DCONFIG_SPIRAM_MODE_OPI=1

build_flags =
  -DARDUINOJSON_USE_CBOR=1
  ; loopTask 默认栈 8KB，命令路径（JSON 解析 + Capability Registry 重扫）
  ; 实测会溢出（Stack canary watchpoint triggered (loopTask)）。
  ; 提到 16KB：本工程 DRAM 余量充足（静态占用约 130KB / 327KB）。
  -DARDUINO_LOOP_STACK_SIZE=16384

upload_speed = 921600
monitor_speed = 115200


lib_deps =
    olikraus/U8g2    #oled驱动库依赖
    bblanchon/ArduinoJson    #json解析库依赖
    bogde/HX711 #HX711驱动库依赖
    h2zero/NimBLE-Arduino #蓝牙驱动库依赖

lib_ldf_mode = deep+

extra_scripts = fix_compiledb.py
